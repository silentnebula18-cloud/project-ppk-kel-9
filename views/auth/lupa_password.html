<body>
    <div id="dashboard_header">
            <span id="header_logo">⌂</span>
            <span id="header_title">Lupa Password</span>
    </div>

    <div id="field_body">
        <div id="forgot_card">
            <div id="email_wrapper" class="wrapper">
                <input id="email" class="info_field" placeholder="email"></input>
                <p id="email_alert" class="taken">Email tidak terdaftar</p>
            </div>

            <div id="old_password_wrapper" class="wrapper">
                <input id="old_password" class="info_field" placeholder="Password lama" type="password"></input>
                <p id="invalid_old_password" class="taken">Password Tidak Sesuai.</p>
            </div>
            
            <div id="new_password_wrapper" class="wrapper"> 
                <input id="new_password" class="info_field" placeholder="password" type="password"></input>
                <label id="show_password_label">
                    <input type="checkbox" id="show_password"> Tunjukkan password
                </label>
                <div id="pass_checks">
                    <p id="eight" class="check_pass">Mengandung 8 huruf atau lebih</p>
                    <p id="num" class="check_pass">Mengandung sebuah angka</p>
                    <p id="symbol" class="check_pass">Mengandung sebuah simbol</p>
                </div>            
            </div>
        
            <div id="confirm_password_wrapper" class="wrapper">
                <input id="confirm_password" class="info_field" placeholder="konfirmasi password" type="password">
                <p id="confirm_password_error" class="taken">Password tidak cocok</p>
            </div>

            <button id="change_password_button">PERBARUI</button>

            <div id="helpful_texts">
                <p  id="signup">Kembali login? <a href="../../views/auth/login.html">Login</a></p>
            </div>
            
        </div>
    </div>
</body>

<link rel="stylesheet" href="../../public/css/auth/forgot_password_style.css">
<script type="module" src="../../public/js/auth/validasi_lupa_password.js"></script>
